# Builds the docs in docs/ and publishes them to the GitHub Pages of this
# repository. Builds on each pull request that changes docs/; publishes on a
# push to main.
#
# The site at the root is the Starlight site: Latest (the docs of main) and the
# releases kept by starlight-versions at /<version>/. The mdBook copies of
# earlier releases stay at /v<version>/: each deploy builds them again from
# their tag, as the old workflow did. Pages deploys a whole artifact each time,
# so a folder that is not built here is gone after the deploy.

name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  # The mdBook copies of earlier releases, each at /<tag>/.
  MDBOOK_TAGS: v0.9.2
  MDBOOK_VERSION: v0.4.40

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - run: npm ci --no-audit --no-fund
      - run: npm run build
        env:
          DOCS_SITE: ${{ steps.pages.outputs.origin }}
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}
      - name: Add the mdBook copies of earlier releases
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/$MDBOOK_VERSION/mdbook-$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz" | tar -xz -C "$RUNNER_TEMP/bin"
          for tag in $MDBOOK_TAGS; do
            if [ -e "dist/$tag" ]; then echo "dist/$tag is a page of the site"; exit 1; fi
            src="$RUNNER_TEMP/book-$tag"
            mkdir -p "$src"
            git -C "$GITHUB_WORKSPACE" archive "$tag" docs | tar -x -C "$src"
            "$RUNNER_TEMP/bin/mdbook" build "$src/docs" -d "$PWD/dist/$tag"
          done
          ls dist
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
